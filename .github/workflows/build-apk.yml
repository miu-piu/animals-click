name: Build Android APK

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Sync approved animal photos and icon
        run: python3 scripts/sync_assets.py

      - name: Verify exact source asset count
        run: |
          test "$(find app/src/main/assets/images -maxdepth 1 -type f -name '*.webp' | wc -l)" -eq 59
          test -f app/src/main/assets/images/01-arich.webp
          test -f app/src/main/res/drawable-nodpi/zveryata_icon.png

      - name: Verify offline manifest
        run: |
          ! grep -R "android.permission.INTERNET" app/src/main/AndroidManifest.xml

      - name: Run unit tests
        run: gradle :app:testDebugUnitTest --stacktrace

      - name: Run Android lint
        run: gradle :app:lintDebug --stacktrace

      - name: Build debug APK
        run: gradle :app:assembleDebug --stacktrace

      - name: Verify packaged canonical assets
        run: |
          test "$(unzip -l app/build/outputs/apk/debug/app-debug.apk | awk '/assets\/images\/.*\.webp$/ {count++} END {print count+0}')" -eq 59
          unzip -l app/build/outputs/apk/debug/app-debug.apk | grep -q 'assets/images/01-arich.webp'

      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: zveryata-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
