name: Zveryata 2.0 Android UI

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: zveryata-ui-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android-ui:
    runs-on: ubuntu-latest
    env:
      ANDROID_I_WANT_MY_TCG: 'yes'
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Stage offline preview images
        run: |
          python3 scripts/sync_assets.py
          python3 scripts/package_content_v2.py --mode preview
          python3 scripts/validate_catalog_v2.py
      - name: Run real Compose UI tests on Android emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          profile: pixel_6
          emulator-boot-timeout: 1200
          cores: 2
          ram-size: 2048M
          disable-animations: true
          script: |
            gradle :app:connectedDebugAndroidTest --stacktrace
            adb shell wm size 1440x3120
            adb shell wm density 560
            gradle :app:connectedDebugAndroidTest --stacktrace
            mkdir -p app/build/screenshots/v2
            adb shell am force-stop com.miupiu.zveryata
            adb shell am start -n com.miupiu.zveryata/.MainActivity
            sleep 3
            adb exec-out screencap -p > app/build/screenshots/v2/galaxy-qhd-emulator.png
            adb shell wm size 1080x2340
            adb shell wm density 420
            adb shell am force-stop com.miupiu.zveryata
            adb shell am start -n com.miupiu.zveryata/.MainActivity
            sleep 3
            adb exec-out screencap -p > app/build/screenshots/v2/galaxy-fhd-emulator.png
      - name: Upload Android test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-ui-test-reports
          path: |
            app/build/reports/androidTests
            app/build/outputs/androidTest-results
            app/build/screenshots/v2
          if-no-files-found: ignore
